[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/atomtanstudio/xorvio"

[workspace.dependencies]
xorvio-model = { path = "crates/xorvio-model" }
xorvio-core = { path = "crates/xorvio-core" }
xorvio-addons = { path = "crates/xorvio-addons" }
xorvio-media = { path = "crates/xorvio-media" }
xorvio-cast = { path = "crates/xorvio-cast" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
futures-util = "0.3"
bytes = "1"
regex = "1"

[profile.dev]
# Parsing a large provider catalog in debug builds is painfully slow without this.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
